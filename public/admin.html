<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untis+ Dev Server – Admin</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Material Design 3 – Admin-Panel (Web: CSS-only Token-System)
     Basistheme: Material Baseline · Light + Dark (System + Toggle)
     Komponenten: Navigation Drawer, Top App Bar, Buttons, Outlined Fields,
     Filter-Chips, Cards, Tables, Snackbar, Badges.
     ===================================================================== */
  :root {
    color-scheme: light;
    /* ---- Color · Light (Material Baseline) ---- */
    --md-sys-color-primary: #6750a4;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-primary-container: #eaddff;
    --md-sys-color-on-primary-container: #21005d;
    --md-sys-color-secondary: #625b71;
    --md-sys-color-on-secondary: #ffffff;
    --md-sys-color-secondary-container: #e8def8;
    --md-sys-color-on-secondary-container: #1d192b;
    --md-sys-color-tertiary: #7d5260;
    --md-sys-color-on-tertiary: #ffffff;
    --md-sys-color-tertiary-container: #ffd8e4;
    --md-sys-color-on-tertiary-container: #31111d;
    --md-sys-color-error: #b3261e;
    --md-sys-color-on-error: #ffffff;
    --md-sys-color-error-container: #f9dedc;
    --md-sys-color-on-error-container: #410e0b;
    --md-sys-color-surface: #fef7ff;
    --md-sys-color-on-surface: #1d1b20;
    --md-sys-color-on-surface-variant: #49454f;
    --md-sys-color-surface-dim: #ded8e1;
    --md-sys-color-surface-bright: #fef7ff;
    --md-sys-color-surface-container-lowest: #ffffff;
    --md-sys-color-surface-container-low: #f7f2fa;
    --md-sys-color-surface-container: #f3edf7;
    --md-sys-color-surface-container-high: #ece6f0;
    --md-sys-color-surface-container-highest: #e6e0e9;
    --md-sys-color-inverse-surface: #322f35;
    --md-sys-color-inverse-on-surface: #f5eff7;
    --md-sys-color-inverse-primary: #d0bcff;
    --md-sys-color-outline: #79747e;
    --md-sys-color-outline-variant: #cac4d0;
    --md-sys-color-scrim: rgba(0, 0, 0, 0.4);
    /* ---- Shape ---- */
    --md-sys-shape-corner-none: 0px;
    --md-sys-shape-corner-extra-small: 4px;
    --md-sys-shape-corner-small: 8px;
    --md-sys-shape-corner-medium: 12px;
    --md-sys-shape-corner-large: 16px;
    --md-sys-shape-corner-extra-large: 28px;
    --md-sys-shape-corner-full: 9999px;
    /* ---- Motion (Web-Fallback: Timing + Easing) ---- */
    --md-sys-motion-duration-short: 150ms;
    --md-sys-motion-duration-medium: 300ms;
    --md-sys-motion-duration-long: 400ms;
    --md-sys-motion-easing-linear: cubic-bezier(0, 0, 1, 1);
    --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
    --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
    --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
    --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
    /* ---- Elevation (nur Snackbar) ---- */
    --md-sys-elevation-level3: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);
    /* ---- Typography (Roboto Flex) ---- */
    --md-sys-typescale-display-small: 400 36px/44px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-headline-small: 400 24px/32px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-title-large: 400 22px/28px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-title-medium: 500 16px/24px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-title-small: 500 14px/20px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-body-large: 400 16px/24px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-body-medium: 400 14px/20px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-body-small: 400 12px/16px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-label-large: 500 14px/20px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-label-large-prominent: 700 14px/20px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-label-medium: 500 12px/16px "Roboto Flex", Roboto, system-ui, sans-serif;
    --md-sys-typescale-label-small: 500 11px/16px "Roboto Flex", Roboto, system-ui, sans-serif;
  }

  /* ---- Color · Dark (Material Baseline) ---- */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-sys-color-primary: #d0bcff;
    --md-sys-color-on-primary: #381e72;
    --md-sys-color-primary-container: #4f378b;
    --md-sys-color-on-primary-container: #eaddff;
    --md-sys-color-secondary: #ccc2dc;
    --md-sys-color-on-secondary: #332d41;
    --md-sys-color-secondary-container: #4a4458;
    --md-sys-color-on-secondary-container: #e8def8;
    --md-sys-color-tertiary: #efb8c8;
    --md-sys-color-on-tertiary: #492532;
    --md-sys-color-tertiary-container: #633b48;
    --md-sys-color-on-tertiary-container: #ffd8e4;
    --md-sys-color-error: #f2b8b5;
    --md-sys-color-on-error: #601410;
    --md-sys-color-error-container: #8c1d18;
    --md-sys-color-on-error-container: #f9dedc;
    --md-sys-color-surface: #141218;
    --md-sys-color-on-surface: #e6e0e9;
    --md-sys-color-on-surface-variant: #cac4d0;
    --md-sys-color-surface-dim: #141218;
    --md-sys-color-surface-bright: #3b383e;
    --md-sys-color-surface-container-lowest: #0f0d13;
    --md-sys-color-surface-container-low: #1d1b20;
    --md-sys-color-surface-container: #211f26;
    --md-sys-color-surface-container-high: #2b2930;
    --md-sys-color-surface-container-highest: #36343b;
    --md-sys-color-inverse-surface: #e6e0e9;
    --md-sys-color-inverse-on-surface: #322f35;
    --md-sys-color-inverse-primary: #6750a4;
    --md-sys-color-outline: #938f99;
    --md-sys-color-outline-variant: #49454f;
  }

  /* ---- Color · Dark (System-Präferenz, solange kein manueller Wert) ---- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-primary: #381e72;
      --md-sys-color-primary-container: #4f378b;
      --md-sys-color-on-primary-container: #eaddff;
      --md-sys-color-secondary: #ccc2dc;
      --md-sys-color-on-secondary: #332d41;
      --md-sys-color-secondary-container: #4a4458;
      --md-sys-color-on-secondary-container: #e8def8;
      --md-sys-color-tertiary: #efb8c8;
      --md-sys-color-on-tertiary: #492532;
      --md-sys-color-tertiary-container: #633b48;
      --md-sys-color-on-tertiary-container: #ffd8e4;
      --md-sys-color-error: #f2b8b5;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8c1d18;
      --md-sys-color-on-error-container: #f9dedc;
      --md-sys-color-surface: #141218;
      --md-sys-color-on-surface: #e6e0e9;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-color-surface-dim: #141218;
      --md-sys-color-surface-bright: #3b383e;
      --md-sys-color-surface-container-lowest: #0f0d13;
      --md-sys-color-surface-container-low: #1d1b20;
      --md-sys-color-surface-container: #211f26;
      --md-sys-color-surface-container-high: #2b2930;
      --md-sys-color-surface-container-highest: #36343b;
      --md-sys-color-inverse-surface: #e6e0e9;
      --md-sys-color-inverse-on-surface: #322f35;
      --md-sys-color-inverse-primary: #6750a4;
      --md-sys-color-outline: #938f99;
      --md-sys-color-outline-variant: #49454f;
    }
  }

  /* =====================================================================
     Basis
     ===================================================================== */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font: var(--md-sys-typescale-body-medium);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
  }
  ::selection { background: var(--md-sys-color-primary-container); }
  code {
    background: var(--md-sys-color-surface-container-high);
    border-radius: var(--md-sys-shape-corner-extra-small);
    padding: 1px 6px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 0.9em;
    color: var(--md-sys-color-primary);
  }
  :focus-visible { outline: 3px solid var(--md-sys-color-primary); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-full);
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-track { background: transparent; }

  /* =====================================================================
     Layout: Drawer + Main (Top App Bar)
     ===================================================================== */
  .wrap { display: flex; min-height: 100vh; align-items: stretch; }

  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    flex-shrink: 0; width: 280px;
    background: var(--md-sys-color-surface-container);
    border-right: 1px solid var(--md-sys-color-outline-variant);
    padding: 24px 12px 16px;
  }
  .md3-brand { display: flex; gap: 12px; align-items: center; padding: 0 12px 22px; }
  .md3-brand__logo {
    flex-shrink: 0; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    border-radius: var(--md-sys-shape-corner-medium);
  }
  aside h1 { margin: 0; font: var(--md-sys-typescale-title-medium); color: var(--md-sys-color-on-surface); }
  aside .sub { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }

  /* ---- Navigation Drawer Items ---- */
  .navitem {
    display: flex; align-items: center; gap: 12px;
    width: 100%; height: 48px; padding: 0 16px; margin-bottom: 4px;
    border: none; border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    font: var(--md-sys-typescale-label-large);
    letter-spacing: 0.1px; text-align: left; cursor: pointer;
    transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .navitem:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 8%, transparent); }
  .navitem:active { background: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 12%, transparent); }
  .navitem.active {
    position: relative;
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    font: var(--md-sys-typescale-label-large-prominent);
  }
  .navitem.active::before {
    content: ""; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
    width: 4px; height: 24px; border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-on-secondary-container);
  }
  .md3-ic {
    flex-shrink: 0; width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
  }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .md3-topbar {
    position: sticky; top: 0; z-index: 20;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 24px;
    background: var(--md-sys-color-surface);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .md3-topbar__title {
    margin: 0; font: var(--md-sys-typescale-title-large); color: var(--md-sys-color-on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .md3-topbar__actions { display: flex; gap: 4px; flex-shrink: 0; }
  .iconbtn {
    width: 40px; height: 40px; border: none; border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    font-size: 18px; line-height: 1; cursor: pointer;
    transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .iconbtn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 8%, transparent); }
  .iconbtn:active { background: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 12%, transparent); }

  .md3-main-body { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  main section { display: none; }
  main section.active {
    display: block;
    animation: md3-enter var(--md-sys-motion-duration-long) var(--md-sys-motion-easing-emphasized-decelerate);
  }
  @keyframes md3-enter { from { opacity: 0; transform: translateY(8px); } }

  /* =====================================================================
     Oberflächen: Cards + Panels
     ===================================================================== */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--md-sys-color-surface-container-low);
    border-radius: var(--md-sys-shape-corner-medium);
    padding: 16px;
    transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .card:hover { background: var(--md-sys-color-surface-container); }
  .card .n { font: var(--md-sys-typescale-headline-small); color: var(--md-sys-color-primary); }
  .card .l { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }

  .panel {
    background: var(--md-sys-color-surface);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    padding: 16px 20px; margin-bottom: 20px;
    overflow-x: auto;
  }
  .panel h3 { margin: 0 0 14px; font: var(--md-sys-typescale-title-medium); color: var(--md-sys-color-on-surface); }

  /* =====================================================================
     Tabellen
     ===================================================================== */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--md-sys-color-outline-variant); font: var(--md-sys-typescale-body-medium); }
  th { font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  tbody tr { transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard); }
  tbody tr:hover { background: var(--md-sys-color-surface-container-high); }

  /* =====================================================================
     Formulare: Outlined Text Fields + Buttons
     ===================================================================== */
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font: var(--md-sys-typescale-label-medium); color: var(--md-sys-color-on-surface-variant); }
  .field:has(input[type="checkbox"]) { flex-direction: row; align-items: center; gap: 8px; }

  input, select, textarea {
    font: var(--md-sys-typescale-body-medium);
    color: var(--md-sys-color-on-surface);
    background: transparent;
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-small);
    padding: 9px 11px;
    min-height: 40px;
    transition: border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) { border-color: var(--md-sys-color-on-surface); }
  input:focus, select:focus, textarea:focus {
    outline: none; border: 2px solid var(--md-sys-color-primary); padding: 8px 10px;
  }
  input[type="checkbox"] { accent-color: var(--md-sys-color-primary); min-height: auto; }
  input[type="color"] { padding: 2px 4px; min-height: 34px; width: 64px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 40px; padding: 0 24px; border: none;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    font: var(--md-sys-typescale-label-large); letter-spacing: 0.1px;
    cursor: pointer; text-decoration: none;
    transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .btn:hover { background: color-mix(in srgb, var(--md-sys-color-primary) 92%, var(--md-sys-color-on-primary)); }
  .btn:active { background: color-mix(in srgb, var(--md-sys-color-primary) 84%, var(--md-sys-color-on-primary)); }
  .btn.ghost { background: transparent; border: 1px solid var(--md-sys-color-outline); color: var(--md-sys-color-primary); }
  .btn.ghost:hover { background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent); }
  .btn.ghost:active { background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent); }
  .btn.danger { background: transparent; color: var(--md-sys-color-error); }
  .btn.danger:hover { background: color-mix(in srgb, var(--md-sys-color-error) 8%, transparent); }
  .btn.danger:active { background: color-mix(in srgb, var(--md-sys-color-error) 12%, transparent); }

  /* =====================================================================
     Chips / Badges / Dot
     ===================================================================== */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 16px;
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface-variant);
    font: var(--md-sys-typescale-label-medium);
    cursor: pointer;
    transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .chips label:hover { border-color: var(--md-sys-color-on-surface); }
  .chips label:has(input:checked) {
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    border-color: transparent;
  }
  .badge {
    display: inline-block; padding: 3px 10px;
    border-radius: var(--md-sys-shape-corner-full);
    font: var(--md-sys-typescale-label-medium);
    background: var(--md-sys-color-surface-container-highest);
    color: var(--md-sys-color-on-surface-variant);
  }
  .badge.news { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
  .badge.inbox { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
  .badge.ok { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .badge.warn { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .muted { color: var(--md-sys-color-on-surface-variant); }

  /* =====================================================================
     Stundenplan-Grid
     ===================================================================== */
  .grid {
    display: grid; grid-template-columns: 96px repeat(5, 1fr);
    gap: 1px; background: var(--md-sys-color-outline-variant);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    overflow: hidden; font-size: 12px;
  }
  .grid > div { background: var(--md-sys-color-surface); padding: 8px; min-height: 64px; }
  .grid .head {
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface-variant);
    font: var(--md-sys-typescale-label-medium);
    text-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .lesson {
    border-radius: var(--md-sys-shape-corner-extra-small);
    padding: 6px 8px; margin-bottom: 5px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #ffffff;
    transition: filter var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  }
  .lesson:hover { filter: brightness(1.12); }
  .lesson small { display: block; color: rgba(255, 255, 255, 0.85); font-size: 10px; }
  .empty { color: var(--md-sys-color-on-surface-variant); font: var(--md-sys-typescale-body-small); text-align: center; padding: 12px 0; }

  /* =====================================================================
     Snackbar (Toast)
     ===================================================================== */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 60;
    max-width: min(420px, calc(100vw - 48px));
    background: var(--md-sys-color-inverse-surface);
    color: var(--md-sys-color-inverse-on-surface);
    padding: 14px 16px;
    border-radius: var(--md-sys-shape-corner-extra-small);
    font: var(--md-sys-typescale-body-medium);
    box-shadow: var(--md-sys-elevation-level3);
    display: none;

<script>
"use strict";
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
let DB = { classes: [], teachers: [], subjects: [], rooms: [], students: [], lessons: [], homework: [], absences: [], messages: [], school: {}, schoolYear: {} };

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 2600);
}
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  if (res.status === 401) { location.reload(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function load() {
  DB = await api('GET', '/api/admin/bootstrap');
  renderAll();
}
function show(section) {
  $$('aside button').forEach((b) => {
    const active = b.dataset.sec === section;
    b.classList.toggle('active', active);
    if (active) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $$('main section').forEach((s) => s.classList.toggle('active', s.id === 'sec-' + section));
  const nav = $('aside button[data-sec="' + section + '"]');
  const t = $('#topbar-title');
  if (t && nav && nav.dataset.label) t.textContent = nav.dataset.label;
  renderSection(section);
}
function renderAll() {
  $$('main section').forEach((s) => { if (s.classList.contains('active')) renderSection(s.id.replace('sec-', '')); });
}
function renderSection(sec) {
  const fns = { dashboard, classes, teachers, subjects, rooms, students, timetable, homework, absences, messages, data };
  if (fns[sec]) fns[sec]();
}
function byId(list, id) { return list.find((x) => x.id === id); }
function classOf(id) { const c = byId(DB.classes, id); return c ? c.name : '?'; }
function teacherName(id) { const t = byId(DB.teachers, id); return t ? (t.longName || t.name) : '?'; }
function subjectName(id) { const s = byId(DB.subjects, id); return s ? s.name : '?'; }
function roomName(id) { const r = byId(DB.rooms, id); return r ? r.name : '?'; }
function intToTime(v) { v = String(v || 0).padStart(4, '0'); return v.slice(0, 2) + ':' + v.slice(2); }
function timeToInt(v) { if (!v) return 0; return parseInt(v.replace(':', ''), 10); }
function intToDate(v) { const s = String(v || ''); if (s.length !== 8) return ''; return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8); }
function dateToInt(v) { if (!v) return 0; return parseInt(v.replace(/-/g, ''), 10); }
function nowInt() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function fmtDate(ms) {
  if (!ms) return '';
  return new Date(ms).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function WEEKDAYS() { return ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag']; }
const PERIOD_TIMES = [[745, 830], [835, 920], [935, 1020], [1025, 1110], [1120, 1205], [1235, 1320], [1325, 1410]];

async function mutate(method, path, body, msg) {
  try { await api(method, path, body); await load(); if (msg) toast(msg); }
  catch (e) { toast(e.message, true); }
}
function crudForm(collection, fields, onSubmit) { /* fields: [{key,label,type,options|color}] */ }

// ---------------------------------------------------------------- Dashboard
function dashboard() {
  const el = $('#sec-dashboard');
  const counts = {
    Klassen: DB.classes.length, Lehrer: DB.teachers.length, Fächer: DB.subjects.length,
    Räume: DB.rooms.length, Schüler: DB.students.length, 'Unterrichtsstunden (Woche)': DB.lessons.length,
    Hausaufgaben: DB.homework.length, Absenzen: DB.absences.length, Nachrichten: DB.messages.length,
  };
  let cards = Object.entries(counts).map(([l, n]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  el.innerHTML = `
    <div class="panel">
      <h3>Schule</h3>
      <p style="margin:0"><b>${esc(DB.school.longName || DB.school.name)}</b> · Schuljahr <b>${esc(DB.schoolYear.name || '')}</b> · Daten-Pfad: <code>data/db.json</code></p>
    </div>
    <div class="cards">${cards}</div>
    <div class="panel">
      <h3>Schnellzugriff</h3>
      <div class="actions">
        <button class="btn" onclick="show('timetable')">🗓 Stundenplan bearbeiten</button>
        <button class="btn" onclick="show('messages')">✉️ Nachricht erstellen</button>
        <button class="btn ghost" onclick="exportDb()">⬇️ Export (db.json)</button>
        <button class="btn danger" onclick="resetDb()">♻️ Daten zurücksetzen</button>
      </div>
    </div>
    <div class="panel">
      <h3>Wie funktioniert es?</h3>
      <p class="muted" style="line-height:1.6;margin:0">
        Alle Änderungen hier werden sofort in <code>data/db.json</code> gespeichert und von der simulierten WebUntis-API ausgeliefert.
        Der Test-Account <b>testuser</b> ist Schüler <b>Max Mustermann (id 123)</b> aus der <b>${esc(classOf(45))}</b>.
        Melde dich in der Untis+ App an und wechsle ggf. die Klasse, um deine Änderungen zu sehen.
      </p>
    </div>`;
}

// ------------------------------------------------------------ generische Tabellen
function tableFormRow(formId, onSubmit) {
  return `<div class="row" style="margin-top:12px">
    ${formId}
    <button class="btn" onclick="${onSubmit}">Hinzufügen</button>
  </div>`;
}
function fld(key, label, type = 'text', value = '', options = null, extra = '') {
  if (type === 'select') {
    const opts = (options || []).map((o) => `<option value="${esc(o.v)}" ${String(o.v) === String(value) ? 'selected' : ''}>${esc(o.t)}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-k="${key}" ${extra}>${opts}</select></div>`;
  }
  if (type === 'color') return `<div class="field"><label>${label}</label><input data-k="${key}" type="color" value="${esc(value || '#3B82F6')}"></div>`;
  return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`;
}
function collectForm(root) {
  const out = {};
  $$('[data-k]', root).forEach((i) => { const k = i.dataset.k; out[k] = i.type === 'checkbox' ? i.checked : i.value; });
  return out;
}

function classes() {
  const el = $('#sec-classes');
  const options = DB.teachers.map((t) => ({ v: t.id, t: t.longName || t.name }));
  const rows = DB.classes.map((c) => `
    <tr>
      <td><b>${esc(c.name)}</b></td><td>${esc(c.longName)}</td>
      <td>${teacherName(c.teacherId)}</td><td>${roomName(c.roomId)}</td>
      <td>${DB.students.filter((s) => s.classId === c.id).length}</td>
      <td><button class="btn danger" onclick="del('classes',${c.id})">✕</button></td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="panel"><h3>Neue Klasse</h3>${tableFormRow(
      fld('name', 'Kürzel', 'text', '', null, 'placeholder="5A"') +
      fld('longName', 'Name', 'text', '', null, 'placeholder="Klasse 5A"') +
      fld('teacherId', 'Klassenlehrer', 'select', '', options) +
      fld('roomId', 'Kassenraum', 'select', '', DB.rooms.map((r) => ({ v: r.id, t: r.name }))),
      "add('classes')")}
    </div>
    <div class="panel"><h3>Alle Klassen</h3>
      <table><thead><tr><th scope="col">Kürzel</th><th scope="col">Name</th><th scope="col">Klassenlehrer</th><th scope="col">Raum</th><th scope="col">Schüler</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">Keine Klassen vorhanden</td></tr>'}</tbody></table>
    </div>`;
}

function teachers() {
  const el = $('#sec-teachers');
  const rows = DB.teachers.map((t) => `
    <tr><td>${esc(t.name)}</td><td>${esc(t.longName)}</td><td>${esc(t.email)}</td><td>${esc(t.initials)}</td>
    <td><button class="btn danger" onclick="del('teachers',${t.id})">✕</button></td></tr>`).join('');
  el.innerHTML = `
    <div class="panel"><h3>Neuer Lehrer</h3>${tableFormRow(
      fld('name', 'Name (Nachname, Vorname)', 'text', '', null, 'placeholder="Weber, Anna"') +
      fld('longName', 'Anrede/Anzeigename', 'text', '', null, 'placeholder="Frau Weber"') +
      fld('email', 'E-Mail', 'text', '', null, 'placeholder="a.weber@demo.schule"') +
      fld('initials', 'Kürzel', 'text', '', null, 'placeholder="AW"'),
      "add('teachers')")}
    </div>
    <div class="panel"><h3>Alle Lehrer</h3>
      <table><thead><tr><th scope="col">Name</th><th scope="col">Anzeigename</th><th scope="col">E-Mail</th><th scope="col">Kürzel</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Keine Lehrer vorhanden</td></tr>'}</tbody></table>
    </div>`;
}

function subjects() {
  const el = $('#sec-subjects');
  const rows = DB.subjects.map((s) => `
    <tr><td><span class="dot" style="background:${esc(s.color || '#3B82F6')}"></span><b>${esc(s.name)}</b></td>
    <td>${esc(s.longName)}</td><td>${esc(s.color)}</td>
    <td><button class="btn danger" onclick="del('subjects',${s.id})">✕</button></td></tr>`).join('');
  el.innerHTML = `
    <div class="panel"><h3>Neues Fach</h3>${tableFormRow(
      fld('name', 'Kürzel', 'text', '', null, 'placeholder="M"') +
      fld('longName', 'Name', 'text', '', null, 'placeholder="Mathematik"') +
      fld('color', 'Farbe', 'color'), "add('subjects')")}
    </div>
    <div class="panel"><h3>Alle Fächer</h3>
      <table><thead><tr><th scope="col">Fach</th><th scope="col">Name</th><th scope="col">Farbe</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="empty">Keine Fächer vorhanden</td></tr>'}</tbody></table>
    </div>`;
}

function rooms() {
  const el = $('#sec-rooms');
  const rows = DB.rooms.map((r) => `
    <tr><td><b>${esc(r.name)}</b></td><td>${esc(r.longName)}</td>
    <td><button class="btn danger" onclick="del('rooms',${r.id})">✕</button></td></tr>`).join('');
  el.innerHTML = `
    <div class="panel"><h3>Neuer Raum</h3>${tableFormRow(
      fld('name', 'Kürzel', 'text', '', null, 'placeholder="R101"') +
      fld('longName', 'Name', 'text', '', null, 'placeholder="Raum 101"'), "add('rooms')")}
    </div>

      <table><thead><tr><th scope="col">Kürzel</th><th scope="col">Name</th><th scope="col"></th></tr></thead>

    </div>`;
}

function students() {
  const el = $('#sec-students');
  const classOpts = DB.classes.map((c) => ({ v: c.id, t: c.name }));
  const rows = DB.students.map((s) => `
    <tr><td>${esc(s.lastName)}, ${esc(s.firstName)}</td><td>${esc(classOf(s.classId))}</td><td>#${s.id}</td>
    <td><button class="btn danger" onclick="del('students',${s.id})">✕</button></td></tr>`).join('');
  el.innerHTML = `
    <div class="panel"><h3>Neuer Schüler</h3>${tableFormRow(
      fld('firstName', 'Vorname', 'text', '', null, 'placeholder="Emma"') +
      fld('lastName', 'Nachname', 'text', '', null, 'placeholder="Braun"') +
      fld('classId', 'Klasse', 'select', '', classOpts), "add('students')")}
    </div>
    <div class="panel"><h3>Alle Schüler</h3>
      <table><thead><tr><th scope="col">Name</th><th scope="col">Klasse</th><th scope="col">ID</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="empty">Keine Schüler vorhanden</td></tr>'}</tbody></table>
    </div>`;
}

// ------------------------------------------------------------- Stundenplan
let ttClass = null, ttEdit = null;
function timetable() {
  const el = $('#sec-timetable');
  const classOpts = DB.classes.map((c) => ({ v: c.id, t: c.name }));
  el.innerHTML = `
    <div class="panel">
      <div class="row">
        ${fld('tt-class', 'Klasse', 'select', ttClass ?? '', classOpts)}
        <button class="btn" onclick="ttClass=$('#tt-class').value; timetable()">Anzeigen</button>
      </div>
    </div>
    <div id="tt-body">${ttClass ? timetableBody() : '<div class="empty">Bitte zuerst eine Klasse wählen.</div>'}</div>`;
}
function timetableBody() {
  const lessons = DB.lessons.filter((l) => l.classId === Number(ttClass));
  const byKey = {};
  lessons.forEach((l) => { const k = l.weekday + '-' + l.period; (byKey[k] = byKey[k] || []).push(l); });
  const head = ['Zeit', ...WEEKDAYS().map((d) => `<div class="head">${d}</div>`)].join('');
  const cells = [];
  for (let p = 1; p <= 7; p++) {
    cells.push(`<div class="head">${p}. Std.<br><small class="muted">${intToTime(PERIOD_TIMES[p - 1][0])}–${intToTime(PERIOD_TIMES[p - 1][1])}</small></div>`);
    for (let wd = 1; wd <= 5; wd++) {
      const list = byKey[wd + '-' + p] || [];
      const html = list.map((l) => {
        const subj = byId(DB.subjects, l.subjectId);
        return `<div class="lesson" style="background:${esc(subj ? subj.color : '#3B82F6')}" onclick="ttEdit=${l.id}; timetable()" title="Klicken zum Bearbeiten">
          <b>${esc(subjectName(l.subjectId))}</b><small>${esc(teacherName(l.teacherId))} · ${esc(roomName(l.roomId))}</small>
        </div>`;
      }).join('');
      cells.push(`<div>${html || '<div class="empty">—</div>'}</div>`);
    }
  }
  const form = ttForm();
  return `
    <div class="panel">
      <h3>${ttClass ? 'Klasse ' + esc(classOf(ttClass)) : 'Stundenplan'}</h3>
      <div class="grid">${head}${cells.join('')}</div>
    </div>
    ${form}
    <div class="panel"><h3>Alle Stunden dieser Klasse</h3>
      <table><thead><tr><th scope="col">Tag</th><th scope="col">Zeit</th><th scope="col">Fach</th><th scope="col">Lehrer</th><th scope="col">Raum</th><th scope="col"></th></tr></thead>
      <tbody>${lessons.sort((a, b) => a.weekday - b.weekday || a.startTime - b.startTime).map((l) => `
        <tr><td>${WEEKDAYS()[l.weekday - 1]}</td><td>${intToTime(l.startTime)}–${intToTime(l.endTime)}</td>
        <td>${esc(subjectName(l.subjectId))}</td><td>${esc(teacherName(l.teacherId))}</td><td>${esc(roomName(l.roomId))}</td>
        <td><button class="btn ghost" onclick="ttEdit=${l.id}; timetable()">✏️</button> <button class="btn danger" onclick="del('lessons',${l.id})">✕</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Noch keine Stunden</td></tr>'}
      </tbody></table>
    </div>`;
}
function ttForm() {
  const l = ttEdit ? byId(DB.lessons, ttEdit) : null;
  const weekday = l ? l.weekday : 1;
  const period = l ? l.period : 1;
  const periodOpts = PERIOD_TIMES.map((p, i) => ({ v: i + 1, t: `${i + 1}. Std. (${intToTime(p[0])}–${intToTime(p[1])})` }));
  const time = PERIOD_TIMES[period - 1];
  return `<div class="panel" id="tt-form"><h3>${ttEdit ? 'Stunde bearbeiten (#' + ttEdit + ')' : 'Neue Stunde'}</h3><div class="row">
    ${fld('weekday', 'Wochentag', 'select', weekday || '', WEEKDAYS().map((d, i) => ({ v: i + 1, t: d })))}
    ${fld('period', 'Stunde', 'select', period || '', periodOpts)}
    ${fld('subjectId', 'Fach', 'select', l && l.subjectId || '', DB.subjects.map((s) => ({ v: s.id, t: s.name })))}
    ${fld('teacherId', 'Lehrer', 'select', l && l.teacherId || '', DB.teachers.map((t) => ({ v: t.id, t: t.longName || t.name })))}
    ${fld('roomId', 'Raum', 'select', l && l.roomId || '', DB.rooms.map((r) => ({ v: r.id, t: r.name })))}
    <button class="btn" onclick="saveLesson()">${ttEdit ? 'Speichern' : 'Hinzufügen'}</button>
    ${ttEdit ? '<button class="btn ghost" onclick="ttEdit=null; timetable()">Abbrechen</button>' : ''}
  </div></div>`;
}
async function saveLesson() {
  const form = $('#tt-form');
  const wd = Number($('[data-k="weekday"]', form).value);
  const period = Number($('[data-k="period"]', form).value);
  const base = { classId: Number(ttClass), weekday: wd, period, startTime: PERIOD_TIMES[period - 1][0], endTime: PERIOD_TIMES[period - 1][1] };
  const extra = collectForm(form);
  delete extra.weekday; delete extra.period;
  const item = { ...base, ...extra };
  if (ttEdit) { await mutate('PUT', '/api/admin/lessons/' + ttEdit, item, 'Stunde aktualisiert'); ttEdit = null; }
  else { item.id = undefined; await mutate('POST', '/api/admin/lessons', item, 'Stunde hinzugefügt'); }
  timetable();
}

// ------------------------------------------------------------ Hausaufgaben
let hwClass = null;
function homework() {
  const el = $('#sec-homework');
  const classOpts = DB.classes.map((c) => ({ v: c.id, t: c.name }));
  el.innerHTML = `
    <div class="panel"><div class="row">
      ${fld('hw-class', 'Klasse', 'select', hwClass ?? '', classOpts)}
      <button class="btn" onclick="hwClass=$('#hw-class').value; homework()">Anzeigen</button>
    </div></div>
    <div id="hw-body">${hwClass ? homeworkBody() : '<div class="empty">Bitte zuerst eine Klasse wählen.</div>'}</div>`;
}
function homeworkBody() {
  const list = DB.homework.filter((h) => h.classId === Number(hwClass)).sort((a, b) => a.dueDate - b.dueDate);
  const rows = list.map((h) => `
    <tr>
      <td>${intToDate(h.dueDate)}</td><td>${esc(subjectName(h.subjectId))}</td><td>${esc(teacherName(h.teacherId))}</td>
      <td>${esc(h.text)}</td>
      <td>${h.isDone ? '<span class="badge ok">erledigt</span>' : '<span class="badge">offen</span>'}</td>
      <td><button class="btn danger" onclick="del('homework',${h.id})">✕</button></td>
    </tr>`).join('');
  return `
    <div class="panel" id="hw-form"><h3>Neue Hausaufgabe für ${esc(classOf(hwClass))}</h3>
      <div class="row">
        ${fld('subjectId', 'Fach', 'select', '', DB.subjects.map((s) => ({ v: s.id, t: s.name })))}
        ${fld('teacherId', 'Lehrer', 'select', '', DB.teachers.map((t) => ({ v: t.id, t: t.longName || t.name })))}
        ${fld('dueDate', 'Fällig am', 'date', intToDate(nowInt() + 3))}
        ${fld('text', 'Aufgabe', 'text', '', null, 'placeholder="Bearbeite die Aufgaben…"')}
        <button class="btn" onclick="addHomework()">Hinzufügen</button>
      </div>
    </div>
    <div class="panel"><h3>Hausaufgaben der ${esc(classOf(hwClass))}</h3>
      <table><thead><tr><th scope="col">Fällig</th><th scope="col">Fach</th><th scope="col">Lehrer</th><th scope="col">Aufgabe</th><th scope="col">Status</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">Keine Hausaufgaben</td></tr>'}</tbody></table>
    </div>`;
}
async function addHomework() {
  const form = $('#hw-form');
  const item = { classId: Number(hwClass), ...collectForm(form) };
  const lesson = DB.lessons.find((l) => l.classId === Number(hwClass) && l.subjectId === Number(item.subjectId)) || DB.lessons.find((l) => l.classId === Number(hwClass));
  item.lessonId = lesson ? lesson.id : 1;
  item.dueDate = dateToInt(item.dueDate);
  await mutate('POST', '/api/admin/homework', item, 'Hausaufgabe hinzugefügt');
  homework();
}

// --------------------------------------------------------------- Absenzen
let absClass = null;
function absences() {
  const el = $('#sec-absences');
  const classOpts = DB.classes.map((c) => ({ v: c.id, t: c.name }));
  el.innerHTML = `
    <div class="panel"><div class="row">
      ${fld('abs-class', 'Klasse', 'select', absClass ?? '', classOpts)}
      <button class="btn" onclick="absClass=$('#abs-class').value; absences()">Anzeigen</button>
    </div></div>
    <div id="abs-body">${absClass ? absencesBody() : '<div class="empty">Bitte zuerst eine Klasse wählen.</div>'}</div>`;
}
function absencesBody() {
  const list = DB.absences.filter((a) => a.classId === Number(absClass)).sort((a, b) => a.date - b.date);
  const rows = list.map((a) => `
    <tr>
      <td>${intToDate(a.date)}</td><td>${intToTime(a.startTime)}–${intToTime(a.endTime)}</td>
      <td>${esc(classOf(a.classId))} · ${esc(studentNameById(a.studentId))}</td>
      <td>${esc(subjectName(a.subjectId))}</td><td>${esc(a.reason)}</td>
      <td>${a.excused ? '<span class="badge ok">entschuldigt</span>' : '<span class="badge warn">unentschuldigt</span>'}</td>
      <td><button class="btn danger" onclick="del('absences',${a.id})">✕</button></td>
    </tr>`).join('');
  const studentOpts = DB.students.filter((s) => s.classId === Number(absClass)).map((s) => ({ v: s.id, t: s.firstName + ' ' + s.lastName }));
  return `
    <div class="panel" id="abs-form"><h3>Neue Absenz für ${esc(classOf(absClass))}</h3>
      <div class="row">
        ${fld('studentId', 'Schüler', 'select', '', studentOpts)}
        ${fld('date', 'Datum', 'date', intToDate(nowInt() + 1))}
        ${fld('startTime', 'Beginn', 'time', '08:35')}
        ${fld('endTime', 'Ende', 'time', '09:20')}
        ${fld('subjectId', 'Fach', 'select', '', DB.subjects.map((s) => ({ v: s.id, t: s.name })))}
        ${fld('reason', 'Grund', 'text', '', null, 'placeholder="Krankheit"')}
        <div class="field"><label>Entschuldigt</label><input data-k="excused" type="checkbox" checked></div>
        <button class="btn" onclick="addAbsence()">Hinzufügen</button>
      </div>
    </div>
    <div class="panel"><h3>Absenzen der ${esc(classOf(absClass))}</h3>
      <table><thead><tr><th scope="col">Datum</th><th scope="col">Zeit</th><th scope="col">Schüler</th><th scope="col">Fach</th><th scope="col">Grund</th><th scope="col">Status</th><th scope="col"></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty">Keine Absenzen</td></tr>'}</tbody></table>
    </div>`;
}
function studentNameById(id) {
  const s = byId(DB.students, id);
  return s ? s.firstName + ' ' + s.lastName : '?';
}
async function addAbsence() {
  const form = $('#abs-form');
  const item = collectForm(form);
  item.classId = Number(absClass);
  item.date = dateToInt(item.date);
  item.startTime = timeToInt(item.startTime);
  item.endTime = timeToInt(item.endTime);
  await mutate('POST', '/api/admin/absences', item, 'Absenz hinzugefügt');
  absences();
}

// -------------------------------------------------------------- Nachrichten
function messages() {
  const el = $('#sec-messages');
  const inbox = DB.messages.filter((m) => m.scope === 'inbox');
  const news = DB.messages.filter((m) => m.scope === 'news');
  const classOpts = DB.classes.map((c) => ({ v: c.id, t: c.name }));
  const listHtml = (list) => list.map((m) => `
    <div class="msg" style="${m.read ? 'opacity:.65' : ''}">
      <div class="mfrom">📨 ${esc(m.sender)} · ${fmtDate(m.sent)} · ${m.scope === 'news' ? '<span class="badge news">News</span>' : '<span class="badge inbox">Inbox</span>'}
      ${m.recipients && m.recipients.length ? ' → ' + esc(m.recipients.map((r) => classOf(r.id)).join(', ')) : ' → <i>alle</i>'}
      </div>
      <b>${esc(m.subject)}</b><br>${esc(m.content)}
      <div class="actions">
        <button class="btn ghost" onclick="toggleRead(${m.id}, ${!m.read})">${m.read ? 'Als ungelesen' : 'Als gelesen'}</button>
        <button class="btn danger" onclick="del('messages',${m.id})">✕</button>
      </div>
    </div>`).join('') || '<div class="empty">Keine Nachrichten</div>';
  el.innerHTML = `
    <div class="panel" id="msg-form"><h3>Neue Nachricht</h3>
      <div class="row">
        ${fld('subject', 'Betreff', 'text', '', null, 'placeholder="Elternabend am…"')}
        ${fld('sender', 'Absender', 'text', 'Schulleitung')}
      </div>
      <div style="margin-top:10px"><textarea data-k="content" rows="3" style="width:100%" placeholder="Nachrichtentext…"></textarea></div>
      <div class="row" style="margin-top:10px">
        <div class="field"><label>Sichtbarkeit</label>
          <select data-k="scope"><option value="news">News (für alle sichtbar)</option><option value="inbox">Inbox (an Klassen)</option></select>
        </div>
        <div class="field"><label>Empfänger-Klassen (leer = an alle)</label>
          <div class="chips" id="msg-chips">${classOpts.map((o) => `<label><input type="checkbox" value="${o.v}"> ${esc(o.t)}</label>`).join('') || '<span class="empty">Keine Klassen</span>'}</div>
        </div>
        <button class="btn" onclick="addMessage()">Senden</button>
      </div>
    </div>
    <div class="panel"><h3>📥 Inbox (${inbox.length})</h3>${listHtml(inbox)}</div>
    <div class="panel"><h3>📢 News (${news.length})</h3>${listHtml(news)}</div>`;
}
async function addMessage() {
  const form = $('#msg-form');
  const item = collectForm(form);
  const selected = $$('#msg-chips input:checked').map((c) => ({ id: Number(c.value), type: 'CLASS' }));
  item.recipients = selected;
  item.sent = Date.now();
  item.read = false;
  item.attachments = [];
  delete item['']; // safety
  if (!item.subject.trim() || !item.content.trim()) { toast('Betreff und Inhalt dürfen nicht leer sein', true); return; }
  await mutate('POST', '/api/admin/messages', item, 'Nachricht gesendet');
  messages();
}
async function toggleRead(id, read) {
  await mutate('PUT', '/api/admin/messages/' + id, { read }, read ? 'Als gelesen markiert' : 'Als ungelesen markiert');
}

// ------------------------------------------------------------------- Daten
function data() {
  const el = $('#sec-data');
  el.innerHTML = `
    <div class="panel">
      <h3>Datenspeicher</h3>
      <p class="muted" style="margin:0">Alle Schuldaten liegen in <code>data/db.json</code> und werden bei jeder Änderung sofort gespeichert.</p>
      <div class="actions">
        <button class="btn" onclick="exportDb()">⬇️ Exportieren (db.json)</button>
        <label class="btn" style="cursor:pointer">⬆️ Importieren<input type="file" accept="application/json" style="display:none" onchange="importDb(event)"></label>
        <button class="btn danger" onclick="resetDb()">♻️ Auf Startdaten zurücksetzen</button>
      </div>
    </div>
    <div class="panel">
      <h3>Rohdaten-Vorschau</h3>
      <pre class="raw">${esc(JSON.stringify(DB, null, 2).slice(0, 8000))}</pre>
    </div>`;
}
async function exportDb() {
  const res = await fetch('/api/admin/export');
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'db.json';
  a.click();
  toast('Export gestartet');
}
async function resetDb() {
  if (!confirm('Wirklich alle Daten auf die Startdaten zurücksetzen?')) return;
  await mutate('POST', '/api/admin/reset', null, 'Daten zurückgesetzt');
}
async function importDb(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    await mutate('POST', '/api/admin/import', JSON.parse(text), 'Daten importiert');
  } catch (e) { toast('Import fehlgeschlagen: ' + e.message, true); }
}

// ------------------------------------------------------------- gemeinsame CRUD
async function add(collection) {
  const sec = document.querySelector('section.active');
  const item = collectForm(sec);
  delete item[''];
  await mutate('POST', '/api/admin/' + collection, item, 'Hinzugefügt');
}
async function del(collection, id) {
  if (!confirm('Wirklich löschen?')) return;
  await mutate('DELETE', '/api/admin/' + collection + '/' + id, null, 'Gelöscht');
}

// ------------------------------------------------------------------- Login
async function doLogin() {
  try {
    await api('POST', '/api/admin/login', { password: $('#login-pass').value });
    location.reload();
  } catch (e) { toast('Falsches Passwort', true); }
}
async function init() {
  try {
    const res = await fetch('/api/admin/auth');
    if (res.status === 404) { $('#app').hidden = false; return load(); } // kein ADMIN_PASSWORD gesetzt
    const auth = await res.json();
    if (!auth.authed) { $('#login').hidden = false; return; }
  } catch { $('#login').hidden = false; return; }
  $('#login').hidden = true;
  $('#app').hidden = false;
  await load();
}
// ------------------------------------------------------ Theme (Hell/Dunkel)
function effectiveTheme() {
  if (document.documentElement.dataset.theme) return document.documentElement.dataset.theme;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function syncThemeButton() {
  const btn = $('#theme-toggle');
  if (btn) btn.textContent = effectiveTheme() === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('md3-theme', next);
  syncThemeButton();
}
(function initTheme() {
  const saved = localStorage.getItem('md3-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  syncThemeButton();
})();

init();
</script>
</body>
